name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: market
          POSTGRES_PASSWORD: market
          POSTGRES_DB: market_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U market"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://market:market@localhost:5432/market_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
